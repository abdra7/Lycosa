[package]
name = "lycosa-desktop"
version = "0.5.0"
description = "Lycosa desktop app: controller client and supervisor of the standalone local services"
authors = ["abdra7"]
license = "MIT"
repository = "https://github.com/abdra7/Lycosa"
edition = "2021"
rust-version = "1.89"

[lib]
# the _lib suffix keeps the library and the binary apart on Windows
name = "lycosa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "multipart", "rustls-tls-native-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = "0.3.34"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mdns-sd = "0.21.5"
if-addrs = "0.15"
regex = "1.13"
thiserror = "2.0.21"
getrandom = "0.3.4"
url = "2.5.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.170"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
