name: Release

# Triggered by pushing a version tag (e.g. v0.5.0; v0.5.0-rc.1 makes a
# prerelease):
#   1. builds and pushes the backend Docker image to GHCR (unchanged)
#   2. builds the Tauri desktop app with its standalone runtime on native
#      runners (ADR-037): Windows x64 (.exe), Linux x86_64 (.deb, .AppImage),
#      macOS arm64 and x64 (.dmg). Each package is installed and smoke-tested
#      (start the bundled PostgreSQL + Qdrant + API, sign in, knowledge round
#      trip, clean stop, restart, data check) before it is uploaded.
#   3. creates the GitHub Release with the installers, SHA256SUMS.txt and the
#      notes from CHANGELOG.md
#
# Supply-chain hardening (ADR-030): the token is read-only unless a job
# publishes; actions are pinned to commit SHAs (Dependabot keeps them
# current); the runtime's Python, PostgreSQL and Qdrant builds are pinned
# and sha256-verified (desktop-tauri/runtime/manifest.json); tag-derived
# values reach shell steps only through env.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lycosa-backend:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lycosa-backend:latest

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
          - name: linux-x86_64
            # the oldest supported Ubuntu with webkit2gtk-4.1: the packages
            # then run on any newer glibc
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
          - name: macos-x64
            os: macos-15-intel
            bundles: app,dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag and check it matches every component
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          base="${version%%[-+]*}"
          python3 - "$base" <<'PY'
          import json, re, sys, tomllib
          want = sys.argv[1]
          found = {
              "desktop-tauri/package.json": json.load(open("desktop-tauri/package.json"))["version"],
              "desktop-tauri/src-tauri/tauri.conf.json": json.load(open("desktop-tauri/src-tauri/tauri.conf.json"))["version"],
              "desktop-tauri/src-tauri/Cargo.toml": tomllib.load(open("desktop-tauri/src-tauri/Cargo.toml", "rb"))["package"]["version"],
              "backend/pyproject.toml": tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"],
          }
          bad = {k: v for k, v in found.items() if v != want}
          if bad:
              sys.exit(f"tag version {want} does not match: {bad}")
          print(f"all components at {want}")
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            patchelf file libfuse2

      - name: Stage the standalone runtime (pinned + verified)
        run: python desktop-tauri/scripts/stage_runtime.py

      - name: Install frontend dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build the app and its bundles
        working-directory: desktop-tauri
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: npx tauri build --bundles "$BUNDLES"

      - name: Install the .exe, smoke-test it, uninstall (data kept)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Lycosa'
          $exe = Join-Path $dir 'lycosa-desktop.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse -Depth 1 $dir; throw "not installed at $exe" }
          $report = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $s = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--data-dir', (Join-Path $env:RUNNER_TEMP 'lycosa-smoke'), '--report', $report -Wait -PassThru -NoNewWindow
          Get-Content $report
          if ($s.ExitCode -ne 0) { throw "smoke test failed ($($s.ExitCode))" }
          # an uninstall must not erase user data
          $data = Join-Path $env:LOCALAPPDATA 'com.lycosa.desktop'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'keep.txt') 'user data'
          $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          if (Test-Path $exe) { throw "the app is still installed" }
          if (-not (Test-Path (Join-Path $data 'keep.txt'))) { throw "uninstall removed user data" }
          Write-Host "installed, smoke-tested and uninstalled; user data kept"

      - name: Install the .deb and the AppImage, smoke-test both, remove (data kept)
        if: runner.os == 'Linux'
        run: |
          bundle=desktop-tauri/src-tauri/target/release/bundle
          sudo apt-get install -y "./$(ls $bundle/deb/*.deb)"
          /usr/bin/lycosa-desktop --smoke-test --data-dir "$RUNNER_TEMP/smoke-deb" --report "$RUNNER_TEMP/smoke-deb.json"
          appimage=$(ls $bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --smoke-test --data-dir "$RUNNER_TEMP/smoke-appimage" --report "$RUNNER_TEMP/smoke-appimage.json"
          data="$HOME/.local/share/com.lycosa.desktop"
          mkdir -p "$data" && echo "user data" > "$data/keep.txt"
          sudo apt-get remove -y lycosa-desktop
          test ! -e /usr/bin/lycosa-desktop
          test -f "$data/keep.txt" || { echo "removal erased user data" >&2; exit 1; }
          echo "installed, smoke-tested and removed; user data kept"

      - name: Install from the .dmg and smoke-test
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg)
          mnt="$RUNNER_TEMP/lycosa-dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          cp -R "$mnt/Lycosa.app" "$RUNNER_TEMP/Lycosa.app"
          hdiutil detach "$mnt"
          codesign --verify --verbose "$RUNNER_TEMP/Lycosa.app" || true
          "$RUNNER_TEMP/Lycosa.app/Contents/MacOS/lycosa-desktop" --smoke-test \
            --data-dir "$RUNNER_TEMP/lycosa-smoke" --report "$RUNNER_TEMP/smoke.json"

      - name: Collect the installers under release names
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          bundle=desktop-tauri/src-tauri/target/release/bundle
          mkdir -p dist-release
          case "$NAME" in
            windows-x64)
              cp "$(ls $bundle/nsis/*-setup.exe)" "dist-release/Lycosa-windows-x64-setup-$VERSION.exe" ;;
            linux-x86_64)
              cp "$(ls $bundle/deb/*.deb)" "dist-release/Lycosa-linux-amd64-$VERSION.deb"
              cp "$(ls $bundle/appimage/*.AppImage)" "dist-release/Lycosa-linux-x86_64-$VERSION.AppImage" ;;
            macos-arm64)
              cp "$(ls $bundle/dmg/*.dmg)" "dist-release/Lycosa-macos-arm64-$VERSION.dmg" ;;
            macos-x64)
              cp "$(ls $bundle/dmg/*.dmg)" "dist-release/Lycosa-macos-x64-$VERSION.dmg" ;;
          esac
          ls -la dist-release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-image, desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: Check every installer is present, then checksum them
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          cd artifacts
          for f in "Lycosa-windows-x64-setup-$version.exe" "Lycosa-linux-amd64-$version.deb" \
                   "Lycosa-linux-x86_64-$version.AppImage" "Lycosa-macos-arm64-$version.dmg" \
                   "Lycosa-macos-x64-$version.dmg"; do
            test -s "$f" || { echo "missing installer: $f" >&2; exit 1; }
          done
          sha256sum Lycosa-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          # match the section header by literal prefix (index), not a dynamic
          # regex: gawk 5.4 rewrites the escaped "\\[" into a character class
          # and silently matches nothing.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { flag = 1; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if ! [ -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_notes.md
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
