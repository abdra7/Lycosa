name: Release

# Triggered by pushing a version tag (e.g. v0.5.0; v0.5.0-rc.1 makes a
# prerelease):
#   1. builds and pushes the backend Docker image to GHCR (unchanged)
#   2. builds the Tauri desktop app with its standalone runtime on native
#      runners (ADR-037): Windows x64 (.exe), Linux x86_64 (.deb, .AppImage),
#      macOS arm64 and x64 (.dmg). Each package is installed and smoke-tested
#      (start the bundled PostgreSQL + Qdrant + API, sign in, knowledge round
#      trip, clean stop, restart, data check) before it is uploaded.
#   3. creates the GitHub Release with the installers, SHA256SUMS.txt and the
#      notes from CHANGELOG.md
#
# Supply-chain hardening (ADR-030): the token is read-only unless a job
# publishes; actions are pinned to commit SHAs (Dependabot keeps them
# current); the runtime's Python, PostgreSQL and Qdrant builds are pinned
# and sha256-verified (desktop-tauri/runtime/manifest.json); tag-derived
# values reach shell steps only through env.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lycosa-backend:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lycosa-backend:latest

  version:
    name: Version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # build, install, smoke-test and upload on native runners; the same
  # workflow runs as a dry run on pull requests labeled release-check
  desktop:
    name: Desktop
    needs: version
    uses: ./.github/workflows/desktop-bundles.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-image, desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: Check every installer is present, then checksum them
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          cd artifacts
          for f in "Lycosa-windows-x64-setup-$version.exe" "Lycosa-linux-amd64-$version.deb" \
                   "Lycosa-linux-x86_64-$version.AppImage" "Lycosa-macos-arm64-$version.dmg" \
                   "Lycosa-macos-x64-$version.dmg"; do
            test -s "$f" || { echo "missing installer: $f" >&2; exit 1; }
          done
          sha256sum Lycosa-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          # match the section header by literal prefix (index), not a dynamic
          # regex: gawk 5.4 rewrites the escaped "\\[" into a character class
          # and silently matches nothing.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { flag = 1; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if ! [ -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_notes.md
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
