name: Release

# Triggered by pushing a version tag (e.g. v0.1.0):
#   1. builds and pushes the backend Docker image to GHCR
#   2. builds the desktop dashboard installers for macOS / Windows / Linux
#   3. creates a GitHub Release with the installers attached and notes
#      extracted from CHANGELOG.md
#
# Supply-chain hardening (ADR-030): the token is read-only unless a job
# publishes; actions are pinned to commit SHAs (Dependabot keeps them
# current); downloaded build tools are versioned and sha256-verified before
# they run; tag-derived values reach shell steps only through env.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lycosa-backend:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lycosa-backend:latest

  desktop-macos:
    name: Desktop installer (macOS .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Set version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: dashboard
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package .dmg
        working-directory: dashboard
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/Lycosa.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Lycosa" -srcfolder "$STAGE" -ov -format UDZO \
            "Lycosa-macos-${VERSION}.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-macos
          path: dashboard/Lycosa-macos-*.dmg
          if-no-files-found: error

  desktop-windows:
    name: Desktop installer (Windows .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Set version from tag
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: dashboard
        run: |
          flutter pub get
          flutter build windows --release

      - name: Bundle VC++ runtime DLLs
        working-directory: dashboard
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $dest
          }

      - name: Build installer (Inno Setup)
        working-directory: dashboard/installers/windows
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: iscc "/DAppVersion=$env:VERSION" lycosa.iss

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-windows
          path: dashboard/installers/windows/output/Lycosa-windows-setup-*.exe
          if-no-files-found: error

  desktop-linux:
    name: Desktop installer (Linux AppImage + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev imagemagick libfuse2

      - name: Set version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not a semver version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: dashboard
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package tar.gz
        working-directory: dashboard
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tar -czf "Lycosa-linux-${VERSION}.tar.gz" \
            -C build/linux/x64/release/bundle .

      - name: Package AppImage
        working-directory: dashboard
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # Pinned build tools. To update, change URL and digest together
          # (digest = the release asset's sha256 as published by GitHub).
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          APPDIR=$(mktemp -d)/Lycosa.AppDir
          mkdir -p "$APPDIR/usr"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/"
          cp installers/linux/lycosa.png "$APPDIR/lycosa.png"
          printf '%s\n' '[Desktop Entry]' 'Name=Lycosa' 'Exec=lycosa_dashboard' \
            'Icon=lycosa' 'Type=Application' 'Categories=Utility;' \
            > "$APPDIR/lycosa.desktop"
          printf '%s\n' '#!/bin/sh' \
            'HERE=$(dirname "$(readlink -f "$0")")' \
            'exec "$HERE/usr/lycosa_dashboard" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o runtime-x86_64 "$RUNTIME_URL"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool \
            "$RUNTIME_SHA256" runtime-x86_64 | sha256sum -c -
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --runtime-file runtime-x86_64 \
            "$APPDIR" "Lycosa-linux-${VERSION}.AppImage"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-linux
          path: |
            dashboard/Lycosa-linux-*.AppImage
            dashboard/Lycosa-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-image, desktop-macos, desktop-windows, desktop-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # match the section header by literal prefix (index), not a dynamic
          # regex: gawk 5.4 rewrites the escaped "\\[" into a character class
          # and silently matches nothing.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { flag = 1; next }
            /^## \[/ { if (flag) exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if ! [ -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
