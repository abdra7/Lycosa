name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository (ADR-030)
permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,providers]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy, universal LLM layer)
        run: mypy

      - name: Test (pytest)
        run: pytest

  agent_platforms:
    name: Agent lint + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest

  # Keep the required branch-protection check stable as the matrix evolves.
  agent:
    name: Agent lint + test
    needs: agent_platforms
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all agent platforms to pass
        env:
          MATRIX_RESULT: ${{ needs.agent_platforms.result }}
        run: |
          echo "Agent platform checks: $MATRIX_RESULT"
          test "$MATRIX_RESULT" = "success"

  desktop:
    name: Desktop lint + test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and test (frontend)
        run: |
          npx tsc -b
          npx eslint .
          npx vitest run

      - name: Build the frontend (embedded by the Rust build)
        run: npx vite build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test the runtime staging script
        run: |
          pip install pytest==9.1.1
          python -m pytest scripts -q

      - name: Linux build dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - name: Format, lint and test (Rust)
        working-directory: desktop-tauri/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
